name: Build Rekhta Nothing Library

on:
  workflow_dispatch:
  push:
    paths:
      - 'RekhtaNothingLibrary-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -q RekhtaNothingLibrary-source.zip -d extracted
          ls -la extracted/RekhtaNothingLibrary

      - name: Build debug APK
        working-directory: extracted/RekhtaNothingLibrary
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RekhtaNothingLibrary-APK
          path: extracted/RekhtaNothingLibrary/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
